  #       sleep 86400;
  #       pg_dump -Fc > /backups/guideeasy_$(date +%Y%m%d_%H%M%S).dump;
  #       find /backups -name "*.dump" -mtime +30 -delete;
  #       echo "[backup] Concluído: $(date)";
  #     done'
  #   depends_on:
